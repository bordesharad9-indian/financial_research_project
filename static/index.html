<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financial Research Assistant</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--acc:#0f766e;--acc2:#14b8a6;--accbg:#ccfbf1;--warn:#b45309;--warnbg:#fef3c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#121a2b;--ink:#e6edf7;--mute:#8a98b3;--line:#22304a;--acc:#2dd4bf;--acc2:#14b8a6;--accbg:#0f2f2e;--warn:#fbbf24;--warnbg:#3a2a0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121a2b;--ink:#e6edf7;--mute:#8a98b3;--line:#22304a;--acc:#2dd4bf;--acc2:#14b8a6;--accbg:#0f2f2e;--warn:#fbbf24;--warnbg:#3a2a0a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),#0369a1);display:grid;place-items:center;color:#fff;font-size:20px}
h1{font-size:20px;margin:0;line-height:1.2}header p{margin:0;color:var(--mute);font-size:13px}
.sp{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}.live .dot{background:#22c55e}.demo .dot{background:#f59e0b}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.pipe{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px}
.st{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);position:relative;transition:.25s}
.st b{display:block;font-size:13px}.st span{font-size:12px;color:var(--mute)}
.st i{position:absolute;top:10px;right:10px;font-style:normal;font-size:12px;color:var(--mute)}
.st.on{border-color:var(--acc2);background:var(--accbg);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 25%,transparent)}
.st.on i{animation:sp 1s linear infinite;display:inline-block;color:var(--acc)}
.st.done{border-color:var(--acc2)}.st.done i{color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:-1px}
textarea{resize:vertical;min-height:84px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 16px;font-weight:600;background:var(--acc);color:#04201d;transition:.15s}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.full{width:100%;margin-top:14px}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.doc small{color:var(--mute);display:block}.doc .ic{font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;font-weight:500}
.chip.sel{background:var(--accbg);border-color:var(--acc2);color:var(--acc)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugg button{font-size:12px;font-weight:500;padding:4px 10px;background:var(--bg);color:var(--mute);border:1px dashed var(--line)}
.rep{min-height:120px}.rep p{margin:0 0 10px}.rep ul{margin:0 0 10px;padding-left:20px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.err{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px}
.src{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.src:first-of-type{border-top:0}.src small{color:var(--mute)}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.bar u{display:block;height:100%;background:var(--acc2)}
.toast{font-size:13px;margin-top:10px;color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">📊</div>
  <div><h1>Financial Research Assistant</h1><p>RAG pipeline · ChromaDB · Groq LLM</p></div>
  <div class="sp"></div>
  <div class="pill demo" id="status"><span class="dot"></span><span id="stxt">Checking API…</span></div>
  <button class="ghost" id="theme" aria-label="Toggle theme" style="padding:6px 10px">◐</button>
</header>

<div class="pipe" id="pipe"></div>

<div class="grid">
  <div class="col">
    <div class="card">
      <h2>Ingest report</h2>
      <label for="path">PDF path</label>
      <input id="path" value="Data/msft.pdf">
      <div class="row">
        <div><label for="co">Company</label><input id="co" value="Microsoft"></div>
        <div><label for="yr">Year</label><input id="yr" type="number" value="2025"></div>
      </div>
      <button class="full" id="ingest">Index document</button>
      <div id="itoast"></div>
    </div>
    <div class="card">
      <h2>Document library</h2>
      <div class="docs" id="docs"></div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2>Ask a question</h2>
      <label>Companies</label>
      <div class="chips" id="chips"></div>
      <label for="q">Research query</label>
      <textarea id="q" placeholder="e.g. Compare revenue growth across the selected companies"></textarea>
      <div class="sugg" id="sugg"></div>
      <button class="full" id="run">Run research</button>
      <div id="err"></div>
    </div>
    <div class="card">
      <h2>Report</h2>
      <div class="rep" id="rep"><div class="empty">Your research report will appear here.</div></div>
    </div>
    <div class="card" id="srcCard" hidden>
      <h2>Sources</h2>
      <div id="srcs"></div>
    </div>
  </div>
</div>
</div>

<script>
const STAGES=[["📄","PDF load","PyPDFLoader"],["✂️","Chunking","1000 / 200 overlap"],["🧬","Embedding","all-MiniLM-L6-v2"],["🗄️","Vector store","ChromaDB · cosine"],["🤖","LLM answer","Groq · gemma2-9b"]];
const DOCS=[["msft.pdf","Microsoft","2025"],["Annual-Report-2025.pdf","Annual report","2025"],["0001104659-25-092966.pdf","SEC filing","2025"],["e26089_uber-ars.pdf","Uber","2025"]];
const COMPANIES=["Microsoft","Uber","Annual report","SEC filing"];
const SUGG=["What are the key financial highlights?","Summarize the main business risks","Compare revenue and operating income"];
const $=id=>document.getElementById(id);
let live=false,selected=new Set(["Microsoft"]);

$("pipe").innerHTML=STAGES.map((s,i)=>`<div class="st" id="st${i}"><i>${s[0]}</i><b>${i+1}. ${s[1]}</b><span>${s[2]}</span></div>`).join("");
$("docs").innerHTML=DOCS.map(d=>`<div class="doc"><span class="ic">📑</span><div>${d[0]}<small>${d[1]} · ${d[2]}</small></div></div>`).join("");
$("sugg").innerHTML=SUGG.map(s=>`<button type="button">${s}</button>`).join("");
$("sugg").onclick=e=>{if(e.target.tagName==="BUTTON")$("q").value=e.target.textContent};
function drawChips(){$("chips").innerHTML=COMPANIES.map(c=>`<button type="button" class="chip ${selected.has(c)?"sel":""}" data-c="${c}">${c}</button>`).join("")}
$("chips").onclick=e=>{const c=e.target.dataset.c;if(!c)return;selected.has(c)?selected.delete(c):selected.add(c);drawChips()};
drawChips();

$("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};

function setStatus(){const s=$("status");s.className="pill "+(live?"live":"demo");$("stxt").textContent=live?"API connected":"Demo mode (mock data)"}
fetch("/openapi.json").then(r=>r.ok?r.json():Promise.reject()).then(j=>{live=!!(j.paths&&j.paths["/research"])}).catch(()=>{live=false}).finally(setStatus);

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function resetPipe(){STAGES.forEach((_,i)=>$("st"+i).className="st")}
async function animate(upto,stop){
  resetPipe();
  for(let i=0;i<upto;i++){
    if(stop.v)break;
    $("st"+i).className="st on";await wait(i===upto-1?0:650);
    if(i<upto-1)$("st"+i).className="st done";
  }
}
function finish(upto){for(let i=0;i<upto;i++)$("st"+i).className="st done"}

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function md(t){
  const out=[];let list=false;
  for(const raw of esc(t).split("\n")){
    const l=raw.trim().replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(/^[-*] /.test(l)){if(!list){out.push("<ul>");list=true}out.push("<li>"+l.slice(2)+"</li>")}
    else{if(list){out.push("</ul>");list=false}if(l)out.push("<p>"+l+"</p>")}
  }
  if(list)out.push("</ul>");return out.join("")
}

function mockReport(q,cos){
  const c=[...cos].join(" and ")||"the selected companies";
  return `**Research summary for ${c}**\n\nBased on the retrieved passages, here is what the filings say about your question: “${q}”\n\n- **Revenue:** the reports describe growth driven by cloud and platform services; exact figures should be confirmed against the cited pages.\n- **Profitability:** operating income is reported as rising, with margins supported by cost discipline.\n- **Risks:** competition, regulation and macroeconomic conditions are repeatedly flagged.\n\nThis is sample output from demo mode. Connect the FastAPI backend to see answers generated from your indexed PDFs.`
}
function mockSources(){
  return [["msft.pdf",42,.86],["msft.pdf",57,.81],["e26089_uber-ars.pdf",18,.74],["Annual-Report-2025.pdf",9,.69]].map(s=>({source_file:s[0],page:s[1],score:s[2]}))
}

async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||("Request failed ("+r.status+")"));
  return j;
}

$("run").onclick=async()=>{
  const q=$("q").value.trim();$("err").innerHTML="";
  if(!q){$("err").innerHTML='<div class="err">Please enter a research query.</div>';return}
  const btn=$("run");btn.disabled=true;btn.textContent="Researching…";
  const stop={v:false};const anim=animate(5,stop);
  try{
    let data;
    if(live){data=await post("/research",{query:q,companies:[...selected]})}
    else{await wait(3200);data={report:mockReport(q,selected),sources:mockSources()}}
    stop.v=true;await anim.catch(()=>{});finish(5);
    $("rep").innerHTML=md(data.report||"No report returned.");
    const src=data.sources||[];$("srcCard").hidden=!src.length;
    $("srcs").innerHTML=src.map(s=>{
      const sc=typeof s.score==="number"?s.score:null;
      return `<div class="src"><div>${esc(s.source_file||s.company||"unknown")}<br><small>${s.page!=null?"Page "+(Number(s.page)+(live?1:0)):""}${s.year?" · "+esc(s.year):""}</small></div>${sc!==null?`<small>${(sc*100).toFixed(0)}% match</small><div class="bar"><u style="width:${sc*100}%"></u></div>`:""}</div>`
    }).join("");
  }catch(e){stop.v=true;resetPipe();$("err").innerHTML='<div class="err">'+esc(e.message)+"</div>"}
  btn.disabled=false;btn.textContent="Run research";
};

$("ingest").onclick=async()=>{
  const b=$("ingest");b.disabled=true;b.textContent="Indexing…";$("itoast").innerHTML="";
  const stop={v:false};const anim=animate(4,stop);
  try{
    const body={pdf_path:$("path").value.trim(),company:$("co").value.trim(),year:parseInt($("yr").value,10)};
    let d;
    if(live)d=await post("/ingest",body);
    else{await wait(2800);d={indexed_chunks:Math.floor(300+Math.random()*400),company:body.company,year:body.year}}
    stop.v=true;await anim.catch(()=>{});finish(4);
    $("itoast").innerHTML=`<div class="toast">✓ Indexed ${d.indexed_chunks} chunks for ${esc(d.company)} (${d.year})</div>`;
  }catch(e){stop.v=true;resetPipe();$("itoast").innerHTML='<div class="err">'+esc(e.message)+"</div>"}
  b.disabled=false;b.textContent="Index document";
};
</script>
</body>
</html>
